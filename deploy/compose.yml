name: personal-site
services:
  site:
    image: ${IMAGE_REFERENCE:?Set IMAGE_REFERENCE to an immutable image digest}
    restart: unless-stopped
    networks:
      proxy:
        aliases:
          - personal-site
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?Set the shared Nginx Proxy Manager network}
