name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: bash -n deploy/deploy.sh deploy/ssh-entrypoint.sh
      - name: Validate workflows and deployment shell
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          docker run --rm --entrypoint shellcheck -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 deploy/deploy.sh deploy/ssh-entrypoint.sh
      - run: python3 -m unittest discover -s tests -v
      - run: node --test tests/*.test.mjs
      - run: docker build --build-arg RELEASE_SHA="$GITHUB_SHA" -t personal-site:test .
      - name: Check production container
        run: |
          docker run -d --name site-test -p 127.0.0.1:8080:80 personal-site:test
          trap 'docker logs site-test; docker rm -f site-test' EXIT
          for ((attempt=0; attempt<30; attempt++)); do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then break; fi
            sleep 2
          done
          node scripts/smoke.mjs http://127.0.0.1:8080 "$GITHUB_SHA"
