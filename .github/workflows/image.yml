name: Build and publish image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: personal-site:test
          build-args: VCS_REF=${{ github.sha }}
      - name: Smoke test image
        run: |
          docker run -d --name personal-site-test -p 127.0.0.1:8080:80 personal-site:test
          trap 'docker rm -f personal-site-test' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then break; fi
            sleep 1
          done
          ./scripts/smoke-image.sh
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        if: github.event_name != 'pull_request'
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/abdulhadi13/personal-site:${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
      - name: Record release candidate
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          {
            echo "### Release candidate"
            echo "Source commit: \`$SOURCE_SHA\`"
            echo "Image: \`ghcr.io/abdulhadi13/personal-site@$DIGEST\`"
            echo 'Publishing this image does not deploy it.'
          } >> "$GITHUB_STEP_SUMMARY"
